[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efmw"
version = "1.0.0"
description = "Reference implementation and experimental harness for EFMW recursive coherence testing"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26","scipy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
